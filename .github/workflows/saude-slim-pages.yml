name: Saúde Slim - build e publicação da interface (GitHub Pages)

on:
  push:
    branches:
      - main
      - deploy/github-pages-spa-20261013
    paths:
      - ".github/workflows/saude-slim-pages.yml"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saude-slim-pages-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Bun e Node
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Conferir árvore de rotas
        run: bun run check:routes
      - name: Build estático da interface Saúde Slim
        run: bun run build
        env:
          GITHUB_PAGES_BUILD: "1"
          VITE_SUPABASE_PROJECT_ID: "vyzvfcgpjjzvcjegzzza"
          VITE_SUPABASE_URL: "https://vyzvfcgpjjzvcjegzzza.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2CtVgMTogdtGT_hpxFs-ZQ_Wyul6NVX"
          SUPABASE_PROJECT_ID: "vyzvfcgpjjzvcjegzzza"
          SUPABASE_URL: "https://vyzvfcgpjjzvcjegzzza.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2CtVgMTogdtGT_hpxFs-ZQ_Wyul6NVX"
          PUBLIC_APP_URL: "https://slimesaude.com"
          APP_PUBLIC_URL: "https://slimesaude.com"
      - name: Gerar HTML da interface a partir do build Node
        shell: bash
        env:
          PORT: "3100"
          HOST: "127.0.0.1"
          SUPABASE_PROJECT_ID: "vyzvfcgpjjzvcjegzzza"
          SUPABASE_URL: "https://vyzvfcgpjjzvcjegzzza.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2CtVgMTogdtGT_hpxFs-ZQ_Wyul6NVX"
          PUBLIC_APP_URL: "https://slimesaude.com"
        run: |
          set -euo pipefail
          test -d .output/public
          node .output/server/index.mjs > /tmp/saude-slim-ssr.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 35); do
            if curl --fail --silent --show-error --max-time 4 "http://127.0.0.1:3100/auth" > /tmp/saude-slim-auth.html; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ] || ! grep -qi '<html' /tmp/saude-slim-auth.html; then
            echo "::error::O servidor compilado não gerou HTML para /auth."
            tail -n 120 /tmp/saude-slim-ssr.log
            exit 1
          fi
          cp /tmp/saude-slim-auth.html .output/public/index.html
          if ! find .output/public -type f \( -name '*.js' -o -name '*.css' \) -print -quit | grep -q .; then
            echo "::error::Build sem JS/CSS."
            exit 1
          fi
          cp .output/public/index.html .output/public/404.html
          printf 'slimesaude.com\n' > .output/public/CNAME
          touch .output/public/.nojekyll
          echo "HTML, assets e CNAME verificados. Backend/server functions não são hospedados pelo Pages."
      - name: Enviar artefatos para GitHub Pages (somente main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar interface
        id: deployment
        uses: actions/deploy-pages@v4
