name: Saúde Slim - build e publicação da interface (GitHub Pages)

on:
  push:
    branches:
      - main
      - deploy/github-pages-spa-20261013
    paths:
      - ".github/workflows/saude-slim-pages.yml"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saude-slim-pages-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Bun e Node
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Conferir árvore de rotas
        run: bun run check:routes
      - name: Build estático da interface Saúde Slim
        run: bun run build
        env:
          GITHUB_PAGES_BUILD: "1"
          VITE_SUPABASE_PROJECT_ID: "vyzvfcgpjjzvcjegzzza"
          VITE_SUPABASE_URL: "https://vyzvfcgpjjzvcjegzzza.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2CtVgMTogdtGT_hpxFs-ZQ_Wyul6NVX"
          SUPABASE_PROJECT_ID: "vyzvfcgpjjzvcjegzzza"
          SUPABASE_URL: "https://vyzvfcgpjjzvcjegzzza.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2CtVgMTogdtGT_hpxFs-ZQ_Wyul6NVX"
          PUBLIC_APP_URL: "https://slimesaude.com"
          APP_PUBLIC_URL: "https://slimesaude.com"
      - name: Gerar HTML da interface a partir do build Node
        shell: bash
        env:
          PORT: "3100"
          HOST: "127.0.0.1"
          SUPABASE_PROJECT_ID: "vyzvfcgpjjzvcjegzzza"
          SUPABASE_URL: "https://vyzvfcgpjjzvcjegzzza.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_2CtVgMTogdtGT_hpxFs-ZQ_Wyul6NVX"
          PUBLIC_APP_URL: "https://slimesaude.com"
        run: |
          set -euo pipefail
          test -d .output/public
          node .output/server/index.mjs > /tmp/saude-slim-ssr.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 35); do
            if curl --fail --silent --show-error --max-time 4 "http://127.0.0.1:3100/auth" > /tmp/saude-slim-auth.html; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ] || ! grep -qi '<html' /tmp/saude-slim-auth.html; then
            echo "::error::O servidor compilado não gerou HTML para /auth."
            tail -n 120 /tmp/saude-slim-ssr.log
            exit 1
          fi
          cp /tmp/saude-slim-auth.html .output/public/index.html
          if ! find .output/public -type f \( -name '*.js' -o -name '*.css' \) -print -quit | grep -q .; then
            echo "::error::Build sem JS/CSS."
            exit 1
          fi
          cp .output/public/index.html .output/public/404.html
          printf 'slimesaude.com\n' > .output/public/CNAME
          touch .output/public/.nojekyll
          echo "HTML, assets e CNAME verificados. Backend/server functions não são hospedados pelo Pages."
      - name: Enviar artefatos para GitHub Pages (somente main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar interface
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar site publicado em slimesaude.com
        shell: bash
        run: |
          set -euo pipefail
          OK=0
          for attempt in $(seq 1 15); do
            if curl --fail --location --silent --show-error --max-time 15 \
              "https://slimesaude.com/?_check=${{ github.sha }}" -o /tmp/saude-slim-live.html; then
              if grep -qi 'Saúde Slim' /tmp/saude-slim-live.html \
                && grep -Eqi '/assets/|/_build/|\\.js' /tmp/saude-slim-live.html; then
                OK=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::GitHub Pages confirmou deploy, mas o domínio não retornou a interface real."
            head -c 1500 /tmp/saude-slim-live.html || true
            exit 1
          fi
          echo "HTTPS no domínio e shell real da Saúde Slim confirmados (HTTP 200)."

      - name: Verificar formulário real no navegador
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            echo "::error::Chromium/Chrome indisponível no runner para teste de renderização."
            exit 1
          fi
          timeout 60 "$CHROME" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom \
            "https://slimesaude.com/auth" > /tmp/saude-slim-browser.html 2> /tmp/chrome-errors.log || true

          echo "DIAGNOSTICO: title da página renderizada:"
          grep -Eo '<title[^>]*>[^<]{0,130}</title>' /tmp/saude-slim-browser.html | head -n 2 || true
          echo "DIAGNOSTICO: primeira parte sem base64:"
          head -c 1500 /tmp/saude-slim-browser.html | sed -E 's/(data:image\/[a-zA-Z]+;base64,)[A-Za-z0-9+/=]+/\1[image redacted]/g' || true
          echo
          echo "DIAGNOSTICO: status root, auth, 404:"
          for addr in https://slimesaude.com/ https://slimesaude.com/auth https://slimesaude.com/404.html; do
            curl --location --silent --output /dev/null --write-out "%{http_code} %{content_type} %{url_effective}\n" --max-time 20 "$addr" || true
          done
          if ! grep -Eqi '<form|type="password"|name="email"' /tmp/saude-slim-browser.html; then
            echo "::error::Não foi possível confirmar o formulário de login renderizado no navegador."
            tail -c 1500 /tmp/saude-slim-browser.html || true
            tail -n 20 /tmp/chrome-errors.log || true
            exit 1
          fi
          echo "Formulário de login renderizado no Chrome headless em /auth."
